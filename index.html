<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>反射ゲーム</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+JP:wght@400;700&display=swap');

  :root {
    --bg: #0a0a14;
    --panel: #12121f;
    --border: #1e1e35;
    --laser: #00ffcc;
    --laser-glow: rgba(0,255,204,0.4);
    --goal-color: #ff4488;
    --accent: #7c4dff;
    --text: #e0e0ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 12px 8px 24px;
    overflow-x: hidden;
  }

  header {
    width: 100%;
    max-width: 420px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .title {
    font-family: 'Orbitron', monospace;
    font-size: 1.3rem;
    font-weight: 900;
    color: var(--laser);
    text-shadow: 0 0 16px var(--laser-glow), 0 0 32px var(--laser-glow);
  }

  .stage-label {
    font-family: 'Orbitron', monospace;
    font-size: 0.85rem;
    color: var(--accent);
    background: rgba(124,77,255,0.12);
    border: 1px solid var(--accent);
    border-radius: 20px;
    padding: 4px 14px;
  }

  .game-wrap {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px;
    box-shadow: 0 0 40px rgba(0,255,204,0.06), 0 8px 32px rgba(0,0,0,0.5);
  }

  #grid-container {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    margin-bottom: 10px;
  }

  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border-radius: 8px;
  }

  #grid-canvas  { z-index: 1; }
  #laser-canvas { z-index: 2; pointer-events: none; }
  #interact-canvas { z-index: 3; }

  .bottom-panel { display: flex; gap: 8px; }

  .go-btn {
    flex: 1;
    background: linear-gradient(135deg, #00ffcc, #00b894);
    color: #0a0a14;
    border: none;
    border-radius: 10px;
    font-family: 'Orbitron', monospace;
    font-size: 1.2rem;
    font-weight: 900;
    cursor: pointer;
    letter-spacing: 0.05em;
    box-shadow: 0 0 20px rgba(0,255,204,0.3);
    transition: all 0.15s;
    min-height: 56px;
  }
  .go-btn:active { transform: scale(0.96); }

  .reset-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: #888;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 0.75rem;
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .reset-btn:active { background: var(--border); color: #ccc; }

  #message {
    height: 20px;
    font-size: 0.72rem;
    color: var(--goal-color);
    text-align: center;
    margin-bottom: 6px;
  }

  #gimmick-badge {
    display: block;
    font-size: 0.62rem;
    color: #aaa;
    background: rgba(255,255,255,0.04);
    border: 1px solid #2a2a40;
    border-radius: 20px;
    padding: 2px 10px;
    margin: 0 auto 6px;
    text-align: center;
    width: 100%;
  }

  .hint {
    font-size: 0.68rem;
    color: #444;
    text-align: center;
    margin-top: 7px;
  }

  /* ── Overlay ── */
  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  #overlay.show { display: flex; }

  .overlay-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 28px;
    text-align: center;
    max-width: 300px;
    width: 90%;
    position: relative;
  }
  .overlay-close {
    position: absolute;
    top: 12px; right: 14px;
    background: transparent;
    border: 1px solid #333;
    color: #666;
    border-radius: 50%;
    width: 28px; height: 28px;
    font-size: 0.85rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    line-height: 1;
  }
  .overlay-close:hover { border-color: #888; color: #ccc; }
  .overlay-emoji { font-size: 3.5rem; margin-bottom: 10px; }
  .overlay-title {
    font-family: 'Orbitron', monospace;
    font-size: 1.5rem;
    font-weight: 900;
    margin-bottom: 6px;
    color: var(--laser);
    text-shadow: 0 0 16px var(--laser-glow);
  }
  .overlay-sub { color: #888; font-size: 0.85rem; margin-bottom: 24px; }
  .overlay-btn {
    background: linear-gradient(135deg, #00ffcc, #00b894);
    color: #0a0a14;
    border: none;
    border-radius: 10px;
    padding: 13px 32px;
    font-family: 'Orbitron', monospace;
    font-size: 0.95rem;
    font-weight: 900;
    cursor: pointer;
    width: 100%;
  }

  /* ── Star Meter ── */
  #star-meter {
    width: 100%;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .star-icons {
    display: flex;
    gap: 3px;
    flex-shrink: 0;
  }

  .star-icon {
    font-size: 1.1rem;
    transition: all 0.2s;
    filter: grayscale(1) opacity(0.3);
  }

  .star-icon.lit {
    filter: none;
    text-shadow: 0 0 8px rgba(255,200,0,0.8);
  }

  .meter-bar-wrap {
    flex: 1;
    height: 12px;
    background: #0d0d1a;
    border: 1px solid #2a2a40;
    border-radius: 6px;
    overflow: hidden;
    position: relative;
  }

  .meter-bar {
    height: 100%;
    border-radius: 6px;
    transition: width 0.2s ease, background 0.3s ease;
    background: linear-gradient(90deg, #00ffcc, #00b894);
  }

  /* threshold markers */
  .meter-marker {
    position: absolute;
    top: 0; bottom: 0;
    width: 2px;
    background: rgba(255,255,255,0.3);
    border-radius: 1px;
  }

  .meter-label {
    font-size: 0.62rem;
    color: #666;
    white-space: nowrap;
    flex-shrink: 0;
    font-family: 'Orbitron', monospace;
  }
  #dev-panel {
    width: 100%;
    max-width: 420px;
    margin-top: 14px;
    background: rgba(255,200,0,0.03);
    border: 1px dashed #443300;
    border-radius: 12px;
    padding: 10px 10px 8px;
  }
  .dev-label {
    font-size: 0.6rem;
    color: #775500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 8px;
    text-align: center;
  }
  .dev-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 5px;
  }
  .dev-btn {
    background: #130f00;
    border: 1px solid #332200;
    color: #886600;
    border-radius: 6px;
    padding: 7px 0;
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
    cursor: pointer;
    transition: all 0.12s;
    text-align: center;
    line-height: 1;
  }
  .dev-btn:active { background: #221800; }
  .dev-btn.active {
    background: #221800;
    border-color: #ffcc00;
    color: #ffcc00;
    box-shadow: 0 0 8px rgba(255,200,0,0.25);
  }
</style>
</head>
<body>

<header>
  <div class="title">⚡ REFLECT</div>
  <div class="stage-label" id="stage-label">STAGE 1</div>
</header>

<div class="game-wrap">
  <!-- Star Meter -->
  <div id="star-meter">
    <div class="star-icons">
      <span class="star-icon lit" id="star1">⭐</span>
      <span class="star-icon lit" id="star2">⭐</span>
      <span class="star-icon lit" id="star3">⭐</span>
    </div>
    <div class="meter-bar-wrap" id="meter-wrap">
      <div class="meter-bar" id="meter-bar"></div>
      <div class="meter-marker" id="marker-2star"></div>
      <div class="meter-marker" id="marker-1star"></div>
    </div>
  </div>
  <div id="message"></div>
  <div id="grid-container">
    <canvas id="grid-canvas"></canvas>
    <canvas id="laser-canvas"></canvas>
    <canvas id="interact-canvas"></canvas>
  </div>
  <div class="bottom-panel">
    <button class="go-btn" onclick="fireGo()">GO!</button>
    <button class="reset-btn" onclick="resetStage()">RESET</button>
  </div>
</div>

<!-- ★ DEV ONLY: 完成時はこのブロックを丸ごと削除 -->
<div id="dev-panel">
  <div class="dev-label">🛠 DEV — ステージセレクト</div>
  <div class="dev-grid" id="dev-grid"></div>
</div>
<!-- /DEV -->

<div id="overlay">
  <div class="overlay-box">
    <button class="overlay-close" onclick="closeOverlay()">✕</button>
    <div class="overlay-emoji" id="overlay-emoji">🎉</div>
    <div class="overlay-title" id="overlay-title">CLEAR!</div>
    <div id="overlay-stars" style="font-size:2rem; margin-bottom:8px; letter-spacing:4px;"></div>
    <div class="overlay-sub" id="overlay-sub"></div>
    <button class="overlay-btn" onclick="nextStage()" id="overlay-btn">NEXT →</button>
  </div>
</div>

function getWarpPartner(stage, col, row) {
  const w = stage.warps;
  for (let i = 0; i < w.length; i += 2) {
    if (w[i].col===col && w[i].row===row)     return w[i+1];
    if (w[i+1] && w[i+1].col===col && w[i+1].row===row) return w[i];
  }
  return null;
}

// ── Sound Engine ─────────────────────────────────────────────
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new AudioCtx();
  // iOSはユーザー操作後にresumeが必要
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// 短いビープ音の汎用関数
function playTone({ freq = 440, type = 'sine', gain = 0.3, duration = 0.1, attack = 0.005, decay = 0.08 }) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gainNode = ctx.createGain();
    osc.connect(gainNode);
    gainNode.connect(ctx.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gainNode.gain.setValueAtTime(0, ctx.currentTime);
    gainNode.gain.linearRampToValueAtTime(gain, ctx.currentTime + attack);
    gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + duration + 0.05);
  } catch(e) {}
}

// ミラー反射：カキーン
function soundReflect() {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gainNode = ctx.createGain();
    osc.connect(gainNode);
    gainNode.connect(ctx.destination);
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(1800, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.12);
    gainNode.gain.setValueAtTime(0.35, ctx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.2);
  } catch(e) {}
}

// ワープ通過：シュン…
function soundWarp() {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gainNode = ctx.createGain();
    osc.connect(gainNode);
    gainNode.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.4);
    gainNode.gain.setValueAtTime(0.28, ctx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.45);
  } catch(e) {}
}
function soundMirrorPlace() {
  playTone({ freq: 600, type: 'triangle', gain: 0.25, duration: 0.08 });
}

// ミラー削除：低めのコツッ
function soundMirrorRemove() {
  playTone({ freq: 300, type: 'triangle', gain: 0.2, duration: 0.07 });
}

// GO!発射：ビューン
function soundLaser() {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gainNode = ctx.createGain();
    osc.connect(gainNode);
    gainNode.connect(ctx.destination);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime + 0.3);
    gainNode.gain.setValueAtTime(0.2, ctx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.35);
  } catch(e) {}
}

// ゴール通過：チーン
function soundGoalHit() {
  playTone({ freq: 1200, type: 'sine', gain: 0.3, duration: 0.25, attack: 0.01 });
}

// クリア：上昇する和音
function soundClear() {
  try {
    const ctx = getAudioCtx();
    [523, 659, 784, 1047].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gainNode = ctx.createGain();
      osc.connect(gainNode);
      gainNode.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      const start = ctx.currentTime + i * 0.1;
      gainNode.gain.setValueAtTime(0, start);
      gainNode.gain.linearRampToValueAtTime(0.25, start + 0.02);
      gainNode.gain.exponentialRampToValueAtTime(0.001, start + 0.4);
      osc.start(start);
      osc.stop(start + 0.45);
    });
  } catch(e) {}
}

// ── Star Meter ────────────────────────────────────────────────
function countMirrors() {
  let n = 0;
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (grid[r][c]) n++;
  return n;
}

function updateMeter() {
  const stage = STAGES[currentStage];
  const { s3, s2 } = stage.stars;
  const reverse = !!stage.reverse;
  // reverseは「GO!後の実反射数」、通常は「置いたミラー総数」
  const count = reverse ? lastHitMirrors : countMirrors();

  const bar = document.getElementById('meter-bar');
  const m2 = document.getElementById('marker-2star');
  const m1 = document.getElementById('marker-1star');

  if (reverse) {
    const maxDisplay = s3;
    const pct = Math.min(1, count / maxDisplay);
    bar.style.width = (pct * 100) + '%';
    if (count >= s3)      bar.style.background = 'linear-gradient(90deg,#00ffcc,#00b894)';
    else if (count >= s2) bar.style.background = 'linear-gradient(90deg,#ffdd00,#ff9900)';
    else                  bar.style.background = 'linear-gradient(90deg,#ff6644,#ff2244)';
    m2.style.left = ((s2 / maxDisplay) * 100) + '%';
    m1.style.display = 'none';
  } else {
    const maxDisplay = s2 + s2;
    const pct = Math.max(0, 1 - count / maxDisplay);
    bar.style.width = (pct * 100) + '%';
    if (count <= s3)      bar.style.background = 'linear-gradient(90deg,#00ffcc,#00b894)';
    else if (count <= s2) bar.style.background = 'linear-gradient(90deg,#ffdd00,#ff9900)';
    else                  bar.style.background = 'linear-gradient(90deg,#ff6644,#ff2244)';
    m2.style.left = (100 - (s3 / maxDisplay) * 100) + '%';
    m1.style.left = (100 - (s2 / maxDisplay) * 100) + '%';
    m1.style.display = '';
  }

  const stars = getStarRating(count, s3, s2, reverse);
  ['star1','star2','star3'].forEach((id, i) => {
    document.getElementById(id).classList.toggle('lit', i < stars);
  });
}

function getStarRating(count, s3, s2, reverse) {
  if (reverse) {
    if (count >= s3) return 3;
    if (count >= s2) return 2;
    return 1;
  }
  if (count <= s3) return 3;
  if (count <= s2) return 2;
  return 1;
}

// ── Resize ───────────────────────────────────────────────────
function resize() {
  const size = document.getElementById('grid-container').offsetWidth;
  gridCanvas.width = laserCanvas.width = interactCanvas.width = size;
  gridCanvas.height = laserCanvas.height = interactCanvas.height = size;
  CELL_SIZE = size / COLS;
  drawGrid();
  if (laserOn) drawLaser();
}
window.addEventListener('resize', resize);

// ── Input ────────────────────────────────────────────────────
interactCanvas.addEventListener('click', e => {
  const r = interactCanvas.getBoundingClientRect();
  tap(e.clientX - r.left, e.clientY - r.top);
});
interactCanvas.addEventListener('touchend', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  const r = interactCanvas.getBoundingClientRect();
  tap(t.clientX - r.left, t.clientY - r.top);
}, { passive: false });

function tap(x, y) {
  const col = Math.floor(x / CELL_SIZE);
  const row = Math.floor(y / CELL_SIZE);
  if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;

  const stage = STAGES[currentStage];
  if (stage.walls.some(w => w.col===col && w.row===row)) return;
  if (stage.start.col===col && stage.start.row===row) return;
  if (stage.goals.some(g => g.col===col && g.row===row)) return;
  if (stage.warps.some(w => w.col===col && w.row===row)) return;

  const cur = grid[row][col];
  grid[row][col] = cur===null ? '/' : cur==='/' ? '\\' : null;
  if (grid[row][col] === null) soundMirrorRemove();
  else soundMirrorPlace();

  laserOn = false;
  clearLaser();
  setMessage('');
  drawGrid();
  updateMeter();
}

// ── Draw ─────────────────────────────────────────────────────
function drawGrid() {
  const stage = STAGES[currentStage];
  const size = gridCanvas.width;
  const cs = CELL_SIZE;

  gctx.clearRect(0, 0, size, size);
  gctx.fillStyle = '#0d0d1a';
  gctx.beginPath();
  gctx.roundRect(0, 0, size, size, 8);
  gctx.fill();

  // Grid lines
  gctx.strokeStyle = '#1e1e35';
  gctx.lineWidth = 1;
  for (let r = 0; r <= ROWS; r++) {
    gctx.beginPath(); gctx.moveTo(0, r*cs); gctx.lineTo(size, r*cs); gctx.stroke();
  }
  for (let c = 0; c <= COLS; c++) {
    gctx.beginPath(); gctx.moveTo(c*cs, 0); gctx.lineTo(c*cs, size); gctx.stroke();
  }

  // Walls
  stage.walls.forEach(({ col, row }) => {
    const wx = col*cs, wy = row*cs;
    gctx.fillStyle = '#2a1f4a';
    gctx.fillRect(wx+1, wy+1, cs-2, cs-2);
    gctx.save();
    gctx.beginPath();
    gctx.rect(wx+1, wy+1, cs-2, cs-2);
    gctx.clip();
    gctx.strokeStyle = '#3d2e6a';
    gctx.lineWidth = 1.5;
    for (let i = -cs; i < cs*2; i += 10) {
      gctx.beginPath();
      gctx.moveTo(wx+i, wy); gctx.lineTo(wx+i+cs, wy+cs);
      gctx.stroke();
    }
    gctx.restore();
    gctx.strokeStyle = '#6a4fcf';
    gctx.lineWidth = 1.5;
    gctx.strokeRect(wx+1.5, wy+1.5, cs-3, cs-3);
    gctx.save();
    gctx.fillStyle = 'rgba(106,79,207,0.6)';
    gctx.font = `bold ${Math.round(cs*0.32)}px sans-serif`;
    gctx.textAlign = 'center';
    gctx.textBaseline = 'middle';
    gctx.fillText('✕', wx+cs/2, wy+cs/2);
    gctx.restore();
  });

  // Warp pairs
  const warpColors = ['#ff9900', '#cc44ff'];
  const w = stage.warps;
  for (let i = 0; i < w.length; i += 2) {
    const color = warpColors[(i/2) % warpColors.length];
    drawWarpCell(w[i].col, w[i].row, color, 'A');
    if (w[i+1]) drawWarpCell(w[i+1].col, w[i+1].row, color, 'B');
  }

  // Mirrors
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (grid[r][c]) drawMirror(c, r, grid[r][c]);

  // Goals
  stage.goals.forEach((g, i) => drawGoal(g.col, g.row, i));

  // Start
  drawStart(stage.start.col, stage.start.row, stage.start.dir);
}

function drawWarpCell(col, row, color, label) {
  const cs = CELL_SIZE;
  const wx = col*cs, wy = row*cs;
  const rgb = hexToRgb(color);
  gctx.fillStyle = `rgba(${rgb},0.1)`;
  gctx.fillRect(wx+1, wy+1, cs-2, cs-2);
  gctx.save();
  gctx.strokeStyle = color;
  gctx.lineWidth = 2;
  gctx.shadowColor = color;
  gctx.shadowBlur = 10;
  gctx.strokeRect(wx+2, wy+2, cs-4, cs-4);
  gctx.restore();
  gctx.save();
  gctx.fillStyle = color;
  gctx.globalAlpha = 0.85;
  gctx.font = `bold ${Math.round(cs*0.38)}px 'Orbitron', monospace`;
  gctx.textAlign = 'center';
  gctx.textBaseline = 'middle';
  gctx.fillText('W', wx+cs/2, wy+cs/2);
  gctx.restore();
}

function hexToRgb(hex) {
  return `${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)}`;
}

function drawMirror(col, row, type) {
  const cs = CELL_SIZE;
  const x = col*cs, y = row*cs, pad = cs*0.18;
  gctx.save();
  gctx.strokeStyle = '#f0c040';
  gctx.lineWidth = Math.max(2.5, cs * 0.075);
  gctx.shadowColor = 'rgba(240,192,64,0.8)';
  gctx.shadowBlur = 12;
  gctx.lineCap = 'round';
  gctx.beginPath();
  if (type === '/') {
    gctx.moveTo(x+cs-pad, y+pad); gctx.lineTo(x+pad, y+cs-pad);
  } else {
    gctx.moveTo(x+pad, y+pad); gctx.lineTo(x+cs-pad, y+cs-pad);
  }
  gctx.stroke();
  gctx.restore();
}

function getArrowBase(col, row, dir) {
  // 矢印の付け根座標を返す（レーザー開始点として使用）
  const cs = CELL_SIZE;
  const cx = col*cs+cs/2, cy = row*cs+cs/2;
  let dx = 0, dy = 0;
  if (dir==='right') dx=1; else if (dir==='left') dx=-1;
  else if (dir==='up') dy=-1; else dy=1;
  return { x: cx + dx*(cs*0.22), y: cy + dy*(cs*0.22) };
}

function drawStart(col, row, dir) {
  const cs = CELL_SIZE;
  const cx = col*cs+cs/2, cy = row*cs+cs/2;
  const color = '#00ffcc';

  // 中心の光る丸
  gctx.save();
  gctx.fillStyle = color;
  gctx.shadowColor = color;
  gctx.shadowBlur = 22;
  gctx.beginPath();
  gctx.arc(cx, cy, cs*0.18, 0, Math.PI*2);
  gctx.fill();
  gctx.restore();

  let dx = 0, dy = 0;
  if (dir==='right') dx=1; else if (dir==='left') dx=-1;
  else if (dir==='up') dy=-1; else dy=1;

  // 矢印：付け根（丸の端）→ 先端（セル端に近い位置）
  const base  = { x: cx + dx*(cs*0.22), y: cy + dy*(cs*0.22) };
  const tip   = { x: cx + dx*(cs*0.44), y: cy + dy*(cs*0.44) };
  const shaft = { x: cx + dx*(cs*0.30), y: cy + dy*(cs*0.30) };
  const headSize = cs * 0.20; // 矢印ヘッドを大きく
  const angle = Math.atan2(dy, dx);

  gctx.save();
  gctx.strokeStyle = color; gctx.fillStyle = color;
  gctx.lineWidth = Math.max(3, cs*0.08);
  gctx.shadowColor = color; gctx.shadowBlur = 14;
  gctx.lineCap = 'round';

  // シャフト
  gctx.beginPath();
  gctx.moveTo(base.x, base.y);
  gctx.lineTo(shaft.x, shaft.y);
  gctx.stroke();

  // 大きめの三角ヘッド
  gctx.beginPath();
  gctx.moveTo(tip.x, tip.y);
  gctx.lineTo(
    tip.x - headSize*Math.cos(angle - Math.PI/5),
    tip.y - headSize*Math.sin(angle - Math.PI/5)
  );
  gctx.lineTo(
    tip.x - headSize*Math.cos(angle + Math.PI/5),
    tip.y - headSize*Math.sin(angle + Math.PI/5)
  );
  gctx.closePath();
  gctx.fill();
  gctx.restore();
}

function drawGoal(col, row, idx) {
  const cs = CELL_SIZE;
  const cx = col*cs+cs/2, cy = row*cs+cs/2;
  const isHit = goalsHit.has(idx);
  const color = isHit ? '#00ffcc' : '#ff4488';

  gctx.save();
  gctx.strokeStyle = color;
  gctx.lineWidth = Math.max(2.5, cs*0.065);
  gctx.shadowColor = color; gctx.shadowBlur = 24;
  gctx.beginPath();
  gctx.arc(cx, cy, cs*0.26, 0, Math.PI*2);
  gctx.stroke();
  gctx.fillStyle = isHit ? 'rgba(0,255,204,0.18)' : 'rgba(255,68,136,0.12)';
  gctx.fill();
  gctx.restore();

  if (STAGES[currentStage].goals.length > 1) {
    gctx.save();
    gctx.fillStyle = color;
    gctx.font = `bold ${Math.round(cs*0.26)}px 'Orbitron', monospace`;
    gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText(idx+1, cx, cy);
    gctx.restore();
  }
}

// ── Laser ─────────────────────────────────────────────────────
// traceLaser now also returns an events array for animation:
//   events: [{ type: 'mirror'|'warp'|'goal', pointIndex, goalIdx? }]
//   points: flat array of all {x,y} points across all segments (with segment breaks)
function traceLaser() {
  const stage = STAGES[currentStage];
  const cs = CELL_SIZE;
  const segments = [];
  const goalOrder = [];
  let warpsUsedCount = 0;
  const hitMirrors = new Set();

  // For animation: flat list of points + events keyed to point index
  const animPoints = [];   // {x, y, segIdx}
  const animEvents = [];   // {type, pointIndex, goalIdx?}

  const queue = [{
    col: stage.start.col, row: stage.start.row, dir: stage.start.dir,
    path: [getArrowBase(stage.start.col, stage.start.row, stage.start.dir)],
    warpsUsed: '', // 直前に通ったワープ出口座標（なければ空文字）
  }];

  while (queue.length > 0) {
    const beam = queue.shift();
    let { col, row, dir, path, warpsUsed } = beam;

    for (let step = 0; step < 300; step++) {
      let nc = col, nr = row;
      if (dir==='right') nc++; else if (dir==='left') nc--;
      else if (dir==='up') nr--; else nr++;

      if (nc<0||nc>=COLS||nr<0||nr>=ROWS) {
        let ex=path[path.length-1].x, ey=path[path.length-1].y;
        if (dir==='right') ex=(col+1)*cs; else if (dir==='left') ex=col*cs;
        else if (dir==='up') ey=row*cs; else ey=(row+1)*cs;
        path.push({x:ex,y:ey}); break;
      }

      if (stage.walls.some(w=>w.col===nc&&w.row===nr)) {
        let ex=nc*cs+cs/2, ey=nr*cs+cs/2;
        if (dir==='right') ex=nc*cs; else if (dir==='left') ex=(nc+1)*cs;
        else if (dir==='up') ey=(nr+1)*cs; else ey=nr*cs;
        path.push({x:ex,y:ey}); break;
      }

      col=nc; row=nr;
      const cx2=col*cs+cs/2, cy2=row*cs+cs/2;

      // Goal — 最後のゴール番号（goals配列の末尾）に到達したときだけ打ち切る
      let hitLastGoal = false;
      stage.goals.forEach((g, gi) => {
        if (g.col===col && g.row===row && !goalOrder.includes(gi)) {
          goalOrder.push(gi);
          path.push({x:cx2, y:cy2});
          animEvents.push({ type: 'goal', pointIndex: animPoints.length + path.length - 1, goalIdx: gi });
          if (gi === stage.goals.length - 1) hitLastGoal = true;
        }
      });
      if (hitLastGoal) break;

      // Warp — 直前に通ったワープと同じ場合のみブロック（無限ループ防止）
      // それ以外は何度でも通過可能
      const warpKey = `${col},${row}`;
      const partner = getWarpPartner(stage, col, row);
      if (partner && warpsUsed !== warpKey) {
        path.push({x:cx2, y:cy2});
        animEvents.push({ type: 'warp', pointIndex: animPoints.length + path.length - 1 });
        segments.push([...path]);
        path.forEach(p => animPoints.push(p));
        warpsUsedCount++;
        queue.push({
          col: partner.col, row: partner.row, dir,
          path: [{x:partner.col*cs+cs/2, y:partner.row*cs+cs/2}],
          warpsUsed: `${partner.col},${partner.row}`, // 直前のワープ出口を記録
        });
        path = null; break;
      }

      // Mirror
      const m = grid[row][col];
      if (m) {
        path.push({x:cx2, y:cy2});
        animEvents.push({ type: 'mirror', pointIndex: animPoints.length + path.length - 1 });
        hitMirrors.add(`${col},${row}`); // 実際に反射したミラーを記録
        if (m==='/') {
          if (dir==='right') dir='up'; else if (dir==='left') dir='down';
          else if (dir==='up') dir='right'; else dir='left';
        } else {
          if (dir==='right') dir='down'; else if (dir==='left') dir='up';
          else if (dir==='up') dir='left'; else dir='right';
        }
      }
    }
    if (path && path.length > 0) {
      segments.push(path);
      path.forEach(p => animPoints.push(p));
    }
  }

  return { segments, goalOrder, warpsUsedCount, animPoints, animEvents, hitMirrorCount: hitMirrors.size };
}

// ── Laser Animation ───────────────────────────────────────────
const MS_PER_CELL = 60; // 1点間60ms（実質1マス約60ms）
let animRAF = null;

function cancelAnim() {
  if (animRAF) { cancelAnimationFrame(animRAF); animRAF = null; }
}

function animateLaser(animPoints, animEvents, onComplete) {
  if (animPoints.length < 2) { onComplete(); return; }

  // 各区間の距離を計算してタイムラインを作る
  const cs = CELL_SIZE;
  const timeline = [0]; // timeline[i] = point i に到達する時間(ms)
  for (let i = 1; i < animPoints.length; i++) {
    // 固定時間/点ベース（距離ベースだと短区間が多く遅くなるため）
    timeline.push(timeline[i-1] + MS_PER_CELL);
  }
  const totalTime = timeline[timeline.length - 1];

  // どのイベントを発火済みか
  const firedEvents = new Set();

  const startTime = performance.now();

  function frame(now) {
    const elapsed = now - startTime;
    const t = Math.min(elapsed, totalTime);

    // 現在位置を求める
    let curX = animPoints[0].x, curY = animPoints[0].y;
    let drawnUpTo = 0; // 何番目の点まで描画したか

    for (let i = 1; i < animPoints.length; i++) {
      if (timeline[i] <= t) {
        drawnUpTo = i;
      } else {
        // i-1 → i の途中
        const segT = (t - timeline[i-1]) / (timeline[i] - timeline[i-1]);
        curX = animPoints[i-1].x + (animPoints[i].x - animPoints[i-1].x) * segT;
        curY = animPoints[i-1].y + (animPoints[i].y - animPoints[i-1].y) * segT;
        drawnUpTo = i - 1;
        break;
      }
    }

    // イベント発火チェック
    animEvents.forEach((ev, ei) => {
      if (!firedEvents.has(ei) && drawnUpTo >= ev.pointIndex) {
        firedEvents.add(ei);
        if (ev.type === 'mirror') {
          soundReflect();
          // reverseステージ：ミラーに当たるたびにメーターをリアルタイム更新
          if (STAGES[currentStage].reverse) {
            lastHitMirrors = [...firedEvents].filter(i => animEvents[i]?.type === 'mirror').length;
            updateMeter();
          }
        }
        if (ev.type === 'warp')   soundWarp();
        if (ev.type === 'goal')   soundGoalHit();
      }
    });

    // ワープ区間のインデックス範囲を収集（入口の次の点=出口点のみ非表示）
    // warpイベントのpointIndex = 入口点。入口点+1 = 出口点（この1点間だけ非表示）
    const warpGaps = new Set();
    animEvents.forEach(ev => {
      if (ev.type === 'warp') {
        // 入口→出口の線分を非表示にするため、入口点のインデックスを記録
        warpGaps.add(ev.pointIndex);
      }
    });

    // ゴール到達点で止まる（最後の番号のゴールのみ）
    const lastNumberedGoalEvent = animEvents.find(ev => ev.type === 'goal' && ev.goalIdx === STAGES[currentStage].goals.length - 1);
    const lastGoalPointIdx = lastNumberedGoalEvent
      ? lastNumberedGoalEvent.pointIndex
      : animPoints.length - 1;

    const drawLimit = Math.min(drawnUpTo, lastGoalPointIdx);
    const drawCurX = drawnUpTo >= lastGoalPointIdx ? animPoints[lastGoalPointIdx].x : curX;
    const drawCurY = drawnUpTo >= lastGoalPointIdx ? animPoints[lastGoalPointIdx].y : curY;

    // 描画：ワープギャップ（入口→出口の線分）だけ切って、それ以外は繋いで描く
    lctx.clearRect(0,0,laserCanvas.width,laserCanvas.height);
    const color = '#ff6644';

    lctx.save();
    lctx.strokeStyle = color; lctx.lineWidth = 3;
    lctx.shadowColor = color; lctx.shadowBlur = 18;
    lctx.lineCap = 'round'; lctx.lineJoin = 'round';
    lctx.setLineDash([]);

    let penDown = false;
    for (let i = 0; i <= drawLimit; i++) {
      if (!penDown) {
        lctx.beginPath();
        lctx.moveTo(animPoints[i].x, animPoints[i].y);
        penDown = true;
      } else if (warpGaps.has(i - 1)) {
        // 前の点がワープ入口 → ここで線を切って出口から新しいパスを開始
        lctx.stroke();
        lctx.beginPath();
        lctx.moveTo(animPoints[i].x, animPoints[i].y);
      } else {
        lctx.lineTo(animPoints[i].x, animPoints[i].y);
      }
    }
    // 先端（現在進行中）
    if (drawnUpTo < lastGoalPointIdx && !warpGaps.has(drawLimit)) {
      lctx.lineTo(drawCurX, drawCurY);
    }
    lctx.stroke();
    lctx.restore();

    if (t < totalTime) {
      animRAF = requestAnimationFrame(frame);
    } else {
      onComplete();
    }
  }

  animRAF = requestAnimationFrame(frame);
}

function drawLaser() {
  lctx.clearRect(0,0,laserCanvas.width,laserCanvas.height);
  if (!laserOn) return;
  const allClear = isClear();
  const color = allClear ? '#00ffcc' : '#ff6644';

  laserSegments.forEach(path => {
    if (path.length < 2) return;
    lctx.save();
    lctx.strokeStyle = color; lctx.lineWidth = 3;
    lctx.shadowColor = color; lctx.shadowBlur = 18;
    lctx.lineCap = 'round'; lctx.lineJoin = 'round';
    lctx.setLineDash([]);
    lctx.beginPath();
    lctx.moveTo(path[0].x, path[0].y);
    for (let i=1; i<path.length; i++) lctx.lineTo(path[i].x, path[i].y);
    lctx.stroke();
    lctx.restore();
  });
}

function clearLaser() {
  lctx.clearRect(0,0,laserCanvas.width,laserCanvas.height);
}

// Check all clear conditions
function isClear() {
  const stage = STAGES[currentStage];
  const expectedOrder = stage.goals.map((_,i)=>i);
  if (JSON.stringify(lastGoalOrder) !== JSON.stringify(expectedOrder)) return false;
  const requiredWarps = stage.warps.length / 2;
  if (requiredWarps > 0 && lastWarpsUsed < requiredWarps) return false;
  return true;
}

// ── Actions ───────────────────────────────────────────────────
let lastGoalOrder = [];
let lastWarpsUsed = 0;
let lastHitMirrors = 0;

function fireGo() {
  cancelAnim();
  laserOn = true;
  soundLaser();

  const res = traceLaser();
  laserSegments = res.segments;
  lastGoalOrder = res.goalOrder;
  lastWarpsUsed = res.warpsUsedCount;
  lastHitMirrors = res.hitMirrorCount;
  goalsHit = new Set(lastGoalOrder);

  // アニメーション開始
  animateLaser(res.animPoints, res.animEvents, () => {
    // アニメ完了後に最終状態を描画
    drawLaser();
    drawGrid();

    if (isClear()) {
      setTimeout(soundClear, 100);
      setTimeout(showClear, 500);
      return;
    }

    const stage = STAGES[currentStage];
    const totalGoals = stage.goals.length;
    const requiredWarps = stage.warps.length / 2;

    if (requiredWarps > 0 && lastWarpsUsed < requiredWarps) {
      setMessage('ワープゾーンを必ず通過させよう！');
    } else if (lastGoalOrder.length === 0) {
      setMessage('もう少し！ミラーを調整してみて');
    } else if (lastGoalOrder.length < totalGoals) {
      setMessage(`あと${totalGoals - lastGoalOrder.length}つのゴールに当てよう！`);
    } else {
      const actual = lastGoalOrder.map(i=>i+1).join('→');
      setMessage(`順番が違う！ ${actual} ではなく 1→2… の順で通過して`);
    }
  });
}

function resetStage() {
  cancelAnim();
  grid = Array.from({length:ROWS},()=>Array(COLS).fill(null));
  laserOn = false; goalsHit = new Set(); laserSegments = [];
  lastGoalOrder = []; lastWarpsUsed = 0; lastHitMirrors = 0;
  clearLaser(); setMessage(''); drawGrid();
  updateMeter();
}

function initStage(idx) {
  currentStage = idx;
  laserOn = false; goalsHit = new Set(); laserSegments = [];
  lastGoalOrder = []; lastWarpsUsed = 0; lastHitMirrors = 0;
  grid = Array.from({length:ROWS},()=>Array(COLS).fill(null));
  document.getElementById('stage-label').textContent = `STAGE ${idx+1}`;
  document.getElementById('overlay').classList.remove('show');
  setMessage('');
  updateDevPanel();
  resize();
  updateMeter();
}

function closeOverlay() {
  document.getElementById('overlay').classList.remove('show');
}

function showClear() {
  const isLast = currentStage >= STAGES.length-1;
  const stage = STAGES[currentStage];
  const count = stage.reverse ? lastHitMirrors : countMirrors();
  const starCount = getStarRating(count, stage.stars.s3, stage.stars.s2, !!stage.reverse);
  const starStr = '⭐'.repeat(starCount) + '☆'.repeat(3 - starCount);

  document.getElementById('overlay-emoji').textContent = isLast ? '🏆' : '🎉';
  document.getElementById('overlay-title').textContent = isLast ? 'ALL CLEAR!' : 'CLEAR!';
  document.getElementById('overlay-stars').textContent = starStr;
  document.getElementById('overlay-sub').textContent = '';
  document.getElementById('overlay-btn').textContent = isLast ? 'RESTART' : 'NEXT →';
  document.getElementById('overlay').classList.add('show');
}

function nextStage() {
  initStage(currentStage >= STAGES.length-1 ? 0 : currentStage+1);
}

function setMessage(msg) {
  document.getElementById('message').textContent = msg;
}

// オーバーレイ背景タップで再表示
document.getElementById('overlay').addEventListener('click', function(e) {
  if (e.target === this) this.classList.add('show');
});

buildDevPanel();
initStage(0);
</script>
